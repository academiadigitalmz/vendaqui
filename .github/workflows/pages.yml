# Publica a demonstração (com a API simulada) no GitHub Pages a cada push para main.
# Requer Pages ativo em Settings → Pages → Source: GitHub Actions.
# Nota: em contas e organizações no plano gratuito, o Pages só funciona em repositórios públicos.
name: Publicar demo no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # o site fica em https://<conta>.github.io/<repositório>/
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_USE_MOCKS: "true"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
